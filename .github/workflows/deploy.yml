name: Publicar no GitHub Pages

# O Pages do repositório está com a fonte "GitHub Actions": cada push no main gera o build
# e publica pela implantação oficial do Pages (sem branch gh-pages).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# um deploy por vez; se chegar um push novo, o anterior é cancelado
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Gerar o build (com as rotas estáticas do postbuild)
        run: npm run build

      - name: Preparar o Pages
        uses: actions/configure-pages@v5

      - name: Enviar o build
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.implantacao.outputs.page_url }}
    steps:
      - name: Publicar
        id: implantacao
        uses: actions/deploy-pages@v4
